openapi: 3.0.3
info:
  title: Altave API - Zip Coders
  description: >
    API para gestão de ordens de serviço (OS): abertura, quadro Kanban,
    encerramento com solução, histórico (linha do tempo) e gerenciamento de usuários.
    Uso interno.


    **Como autenticar:** faça login em `POST /auth/login`, copie o `token` da resposta,
    clique em **Authorize** (cadeado) no topo desta página e cole o token.
    O token expira em 8 horas.
  version: 1.0.0

servers:
  - url: /api
    description: API no mesmo servidor do Swagger

tags:
  - name: Sistema
    description: Verificação de funcionamento
  - name: Autenticação
    description: Login
  - name: Ordens de Serviço
    description: Abertura, Kanban, encerramento e histórico das OS
  - name: Usuários
    description: Cadastro e gerenciamento de usuários
  - name: Relatórios
    description: Indicadores e exportação de ordens de serviço
  - name: Notificações
    description: Acompanhamento das ordens e controle de leitura por conta

paths:
  /health:
    get:
      tags: [Sistema]
      summary: Verifica se a API está no ar
      responses:
        '200':
          description: API funcionando
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }

  /auth/login:
    post:
      tags: [Autenticação]
      summary: Faz login e retorna o token JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, senha]
              properties:
                email: { type: string, format: email, example: maria@empresa.com }
                senha: { type: string, format: password, example: minhasenha123 }
      responses:
        '200':
          description: Login realizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: Token JWT (válido por 8h). Envie em `Authorization Bearer <token>`.
                  user: { $ref: '#/components/schemas/UsuarioLogado' }
        '400':
          description: Email ou senha não informados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '401':
          description: Email ou senha inválidos, ou usuário inativo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }

  /auth/me:
    get:
      tags: [Autenticação]
      summary: Consulta a sessão e o perfil atual
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Dados do usuário autenticado
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/UsuarioLogado' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }

    patch:
      tags: [Autenticação]
      summary: Atualiza o nome do usuário autenticado
      description: Disponível para Técnico e Gestor. Altera somente o nome da própria conta.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome]
              properties:
                nome: { type: string, minLength: 1, maxLength: 100, example: Maria Souza }
      responses:
        '200':
          description: Perfil atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/UsuarioLogado' }
        '400': { $ref: '#/components/responses/RequisicaoInvalida' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '409': { $ref: '#/components/responses/Conflito' }

  /ordens:
    get:
      tags: [Ordens de Serviço]
      summary: Lista as ordens de serviço
      description: Retorna as ordens exibidas no Kanban, da mais recente para a mais antiga. Os filtros são opcionais e cumulativos.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/FiltroStatus'
        - $ref: '#/components/parameters/FiltroResponsavel'
        - $ref: '#/components/parameters/FiltroDataInicio'
        - $ref: '#/components/parameters/FiltroDataFim'
        - $ref: '#/components/parameters/FiltroPeriodo'
      responses:
        '200':
          description: Lista de ordens
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Ordem' }
        '400':
          description: Filtro inválido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
    post:
      tags: [Ordens de Serviço]
      summary: Abre uma nova OS
      description: >
        Cria a OS com status inicial "Aberta", gera o código automaticamente
        (formato `OS-AAAA-0001`) e registra o primeiro evento no histórico.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrdemCreate' }
      responses:
        '201':
          description: OS criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ordem' }
        '400':
          description: Título ou prioridade ausente, ou responsável ou prazo inválido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }

  /ordens/{codigo}:
    patch:
      tags: [Ordens de Serviço]
      summary: Edita campos de uma OS
      description: Envie os campos que mudaram junto com o motivo. Em uma OS aberta ou em andamento, o solicitante, o responsável, um Gestor ou um Administrador pode editar.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CodigoPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/OrdemCampos'
                - type: object
                  required: [motivo]
                  properties:
                    motivo: { type: string, minLength: 5, maxLength: 1000, example: Prazo ajustado após a vistoria. }
      responses:
        '200':
          description: OS atualizada e alteração registrada no histórico
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ordem' }
        '400': { $ref: '#/components/responses/RequisicaoInvalida' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/OrdemNaoEncontrada' }
        '409': { $ref: '#/components/responses/Conflito' }

  /ordens/{codigo}/historico:
    get:
      tags: [Ordens de Serviço]
      summary: Linha do tempo da OS
      description: >
        Eventos da OS, do mais antigo para o mais recente: criação, edições, mudanças de status,
        encerramento e reabertura. Qualquer usuário autenticado pode consultar.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CodigoPath' }]
      responses:
        '200':
          description: Histórico da OS
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Historico' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '404': { $ref: '#/components/responses/OrdemNaoEncontrada' }

  /ordens/{codigo}/status:
    patch:
      tags: [Ordens de Serviço]
      summary: Muda o status da OS (mover card no Kanban)
      description: >
        Move a OS entre as colunas do Kanban.
        **Não aceita "Concluída"**: para concluir use `POST /ordens/{codigo}/encerrar`.
        Reabrir uma OS concluída só é permitido para Gestor ou Administrador.
        Soltar o card na mesma coluna não gera alteração.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CodigoPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [Aberta, 'Em andamento']
                  example: Em andamento
      responses:
        '200':
          description: Status atualizado (ou sem mudança)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ordem' }
        '400':
          description: Status inválido, ou tentativa de concluir sem usar o encerramento
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403':
          description: Somente Gestor ou Administrador pode reabrir uma OS concluída
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '404': { $ref: '#/components/responses/OrdemNaoEncontrada' }

  /ordens/{codigo}/prioridade:
    patch:
      tags: [Ordens de Serviço]
      summary: Altera a prioridade de uma OS
      description: Gestores e administradores podem alterar a prioridade de ordens que ainda não foram concluídas.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CodigoPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prioridade]
              properties:
                prioridade: { $ref: '#/components/schemas/Prioridade' }
      responses:
        '200':
          description: Prioridade atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ordem' }
        '400': { $ref: '#/components/responses/RequisicaoInvalida' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/OrdemNaoEncontrada' }
        '409': { $ref: '#/components/responses/Conflito' }

  /ordens/{codigo}/encerrar:
    post:
      tags: [Ordens de Serviço]
      summary: Encerra a OS com a solução aplicada
      description: >
        Único caminho para concluir uma OS. Exige a descrição da solução (10 a 5000 caracteres).
        Só o responsável pela OS, um Gestor ou um Administrador pode encerrar.
        Só OS "Aberta" ou "Em andamento" podem ser encerradas.
        Registra data de conclusão, quem encerrou e o evento no histórico.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CodigoPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [solucao]
              properties:
                solucao:
                  type: string
                  minLength: 10
                  maxLength: 5000
                  example: Substituída a fonte de alimentação e testado o equipamento por 30 minutos.
      responses:
        '200':
          description: OS encerrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ordem' }
        '400':
          description: Solução muito curta (menos de 10 caracteres) ou longa demais (mais de 5000)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403':
          description: Usuário sem permissão para encerrar esta OS
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '404': { $ref: '#/components/responses/OrdemNaoEncontrada' }
        '409':
          description: A OS já foi encerrada ou não está aberta/em andamento
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }

  /usuarios:
    get:
      tags: [Usuários]
      summary: Lista todos os usuários
      description: Ordenados por nome. Qualquer usuário autenticado pode consultar.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Lista de usuários
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Usuario' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
    post:
      tags: [Usuários]
      summary: Cadastra um novo usuário
      description: Gestores e administradores podem cadastrar membros. A criação de contas de Administrador é restrita a administradores.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UsuarioCreate' }
      responses:
        '201':
          description: Usuário criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '400':
          description: Campos obrigatórios ausentes, senha com menos de 8 caracteres ou perfil inválido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403':
          description: Sem permissão para gerenciar usuários
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '409':
          description: Já existe um usuário com esse email
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }

  /usuarios/{id}/ativo:
    patch:
      tags: [Usuários]
      summary: Ativa ou desativa um usuário
      description: Gestores podem ativar ou desativar outros usuários sem perfil Administrador. O histórico é preservado.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/UsuarioPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ativo]
              properties:
                ativo: { type: boolean, example: false }
      responses:
        '200':
          description: Usuário atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '400': { $ref: '#/components/responses/RequisicaoInvalida' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/UsuarioNaoEncontrado' }
        '409': { $ref: '#/components/responses/Conflito' }

  /usuarios/{id}/perfil:
    patch:
      tags: [Usuários]
      summary: Altera o perfil de um membro
      description: Um Gestor pode atribuir os perfis Usuário, Técnico ou Gestor a outro membro sem perfil Administrador.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/UsuarioPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [perfil]
              properties:
                perfil: { $ref: '#/components/schemas/Perfil' }
      responses:
        '200':
          description: Perfil atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '400': { $ref: '#/components/responses/RequisicaoInvalida' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/UsuarioNaoEncontrado' }
        '409': { $ref: '#/components/responses/Conflito' }

  /usuarios/perfis:
    get:
      tags: [Usuários]
      summary: Lista os perfis que o usuário atual pode atribuir
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/ListaPerfis' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }

  /admin/perfis:
    get:
      tags: [Usuários]
      summary: Lista todos os perfis para administradores
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/ListaPerfis' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }

  /dashboard/status:
    get:
      tags: [Relatórios]
      summary: Consulta o total de ordens por status
      description: Disponível para Gestor e Administrador.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Totais do painel
          content:
            application/json:
              schema:
                type: object
                properties:
                  abertas: { type: integer, minimum: 0 }
                  emAndamento: { type: integer, minimum: 0 }
                  concluidas: { type: integer, minimum: 0 }
                  total: { type: integer, minimum: 0 }
                  atualizadoEm: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }

  /relatorios/ordens/exportar:
    get:
      tags: [Relatórios]
      summary: Exporta as ordens em CSV, Excel ou PDF
      description: Disponível para Gestor e Administrador. O download aplica os filtros informados.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/FiltroStatus'
        - $ref: '#/components/parameters/FiltroResponsavel'
        - $ref: '#/components/parameters/FiltroDataInicio'
        - $ref: '#/components/parameters/FiltroDataFim'
        - $ref: '#/components/parameters/FiltroPeriodo'
        - in: query
          name: formato
          schema: { type: string, enum: [csv, xlsx, pdf], default: csv }
      responses:
        '200':
          description: Arquivo de relatório
          headers:
            Content-Disposition:
              schema: { type: string }
              example: attachment; filename="ordens-2026-11-24.pdf"
          content:
            text/csv:
              schema: { type: string, format: binary }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
            application/pdf:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/RequisicaoInvalida' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }

  /notificacoes:
    get:
      tags: [Notificações]
      summary: Lista as notificações de ordens para a conta atual
      description: Disponível para Gestor e Administrador. Retorna até 20 notificações, com as não lidas primeiro.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Notificações recentes e total de não lidas
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalNaoLidas: { type: integer, minimum: 0 }
                  notificacoes:
                    type: array
                    items: { $ref: '#/components/schemas/Notificacao' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }

  /notificacoes/lidas:
    post:
      tags: [Notificações]
      summary: Marca notificações como lidas para a conta atual
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items: { type: string, format: uuid }
      responses:
        '204': { description: Leitura registrada }
        '400': { $ref: '#/components/responses/RequisicaoInvalida' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token obtido em `POST /auth/login`.

  parameters:
    CodigoPath:
      in: path
      name: codigo
      required: true
      description: Código da OS (não é um número, tem o formato OS-AAAA-0001)
      schema: { type: string }
      example: OS-2026-0001

    UsuarioPath:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    FiltroStatus:
      in: query
      name: status
      schema: { type: string, enum: [Aberta, 'Em andamento', Concluída] }
    FiltroResponsavel:
      in: query
      name: responsavel
      description: Nome do responsável. Use "Não atribuído" para ordens sem responsável.
      schema: { type: string, example: Ana Ferreira }
    FiltroDataInicio:
      in: query
      name: dataInicio
      description: Primeiro dia de abertura incluído, no fuso America/Sao_Paulo.
      schema: { type: string, format: date }
    FiltroDataFim:
      in: query
      name: dataFim
      description: Último dia de abertura incluído, no fuso America/Sao_Paulo.
      schema: { type: string, format: date }
    FiltroPeriodo:
      in: query
      name: periodo
      description: Últimos N dias, quando nenhuma das datas de abertura é informada.
      schema: { type: integer, minimum: 1, maximum: 3650 }

  schemas:
    Erro:
      type: object
      properties:
        erro: { type: string, example: Ordem não encontrada. }

    Prioridade:
      type: string
      enum: [Baixa, Média, Alta, Urgente]
      example: Alta

    Perfil:
      type: string
      enum: [ADMIN, GESTOR, EXECUTOR, USUARIO]

    OrdemCampos:
      type: object
      properties:
        titulo: { type: string, maxLength: 150, example: Computador da recepção não liga }
        descricao: { type: string, example: Ao apertar o botão nada acontece. }
        prioridade: { $ref: '#/components/schemas/Prioridade' }
        responsavelId:
          type: string
          format: uuid
          nullable: true
          description: ID de um usuário ativo. Envie nulo para uma ordem sem responsável.
        responsavel:
          type: string
          description: Nome exato de um usuário ativo. Usado quando responsavelId é omitido.
          example: João Silva
        prazo:
          type: string
          format: date
          nullable: true
          description: Data prevista. Envie nulo na edição para remover o prazo.

    OrdemCreate:
      allOf:
        - $ref: '#/components/schemas/OrdemCampos'
        - type: object
          required: [titulo, prioridade]

    Ordem:
      type: object
      properties:
        id:
          type: string
          description: Código da OS (usado nas rotas como `{codigo}`)
          example: OS-2026-0001
        title: { type: string, example: Computador da recepção não liga }
        descricao: { type: string }
        priority: { type: string, example: Alta }
        status: { type: string, example: Em andamento }
        responsavel: { type: string, example: João Silva }
        responsavelId: { type: string, format: uuid, nullable: true }
        avatar: { type: string, description: Iniciais do responsável, example: JS }
        avatarColor: { type: string, example: '#4f7cff' }
        abertaEm: { type: string, nullable: true, description: Data no formato dd/mm/aaaa, example: 24/10/2026 }
        concluidaEm: { type: string, nullable: true, example: null }
        encerradoPor: { type: string, nullable: true, example: null }
        solicitante: { type: string, nullable: true, description: Nome de quem abriu a OS, example: Maria Souza }
        solicitanteAvatar: { type: string, nullable: true, description: Iniciais de quem abriu a OS, example: MS }
        solicitanteAvatarColor: { type: string, nullable: true, example: '#4f7cff' }
        prazo: { type: string, format: date, nullable: true }
        podeEditar: { type: boolean }
        podeAlterarPrioridade: { type: boolean }
        agingLabel: { type: string, example: Em andamento há 2 dias }
        solucao: { type: string, nullable: true }
        podeEncerrar:
          type: boolean
          description: Se o usuário logado pode encerrar esta OS
        podeReabrir:
          type: boolean
          description: Se o usuário logado pode reabrir esta OS

    Historico:
      type: object
      properties:
        codigo: { type: string, example: OS-2026-0001 }
        titulo: { type: string }
        eventos:
          type: array
          items: { $ref: '#/components/schemas/EventoHistorico' }

    EventoOrdem:
      type: object
      properties:
        id: { type: string, format: uuid }
        tipo:
          type: string
          enum: [criacao, edicao, mudanca, encerramento, reabertura]
        de: { type: string, nullable: true, description: Status anterior (nulo na criação) }
        para: { type: string, description: Novo status, example: Em andamento }
        quem: { type: string, description: Nome de quem registrou o evento }
        em: { type: string, format: date-time, description: Data e hora em formato ISO }
        observacao:
          type: string
          nullable: true
          description: Texto livre (no encerramento, é a solução aplicada)

    EventoHistorico:
      allOf:
        - $ref: '#/components/schemas/EventoOrdem'
        - type: object
          properties:
            avatar: { type: string, example: MS }
            avatarColor: { type: string, example: '#4f7cff' }

    Notificacao:
      allOf:
        - $ref: '#/components/schemas/EventoOrdem'
        - type: object
          properties:
            codigo: { type: string, example: OS-2026-0001 }
            titulo: { type: string }
            lida: { type: boolean }

    UsuarioLogado:
      type: object
      properties:
        id: { type: string, description: Iniciais do usuário, example: MS }
        dbId: { type: string, format: uuid }
        name: { type: string, example: Maria Souza }
        email: { type: string, format: email }
        role: { type: string, description: Nome do perfil para exibição, example: Gestor }
        perfil: { $ref: '#/components/schemas/Perfil' }
        color: { type: string, example: '#4f7cff' }
        permissoes:
          type: object
          description: Presente na consulta da sessão.
          properties:
            relatorios: { type: boolean }

    UsuarioCreate:
      type: object
      required: [nome, email, senha, perfil]
      properties:
        nome: { type: string, maxLength: 100, example: João Silva }
        email: { type: string, format: email, maxLength: 100, example: joao@empresa.com }
        senha: { type: string, format: password, minLength: 8, example: senhaforte123 }
        perfil: { $ref: '#/components/schemas/Perfil' }

    Usuario:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: João Silva }
        email: { type: string, format: email }
        role: { type: string, example: Técnico }
        perfil: { $ref: '#/components/schemas/Perfil' }
        ativo: { type: boolean, example: true }
        avatar: { type: string, example: JS }
        avatarColor: { type: string, example: '#4f7cff' }
        criadoEm: { type: string, format: date-time }
        podeGerenciar: { type: boolean, description: Se a conta atual pode gerenciar este membro }

  responses:
    ListaPerfis:
      description: Perfis disponíveis
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                value: { $ref: '#/components/schemas/Perfil' }
                label: { type: string, example: Técnico }
    RequisicaoInvalida:
      description: Dados ou filtros inválidos
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
    SemPermissao:
      description: Perfil sem permissão para esta operação
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
    UsuarioNaoEncontrado:
      description: Usuário não encontrado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
    Conflito:
      description: Estado do registro incompatível com a alteração
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
    NaoAutenticado:
      description: Token ausente, inválido ou expirado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
    OrdemNaoEncontrada:
      description: Ordem não encontrada
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
